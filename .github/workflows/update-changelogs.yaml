name: Update Changelogs

on:
  schedule:
    - cron: '0 0 * * 0' # Runs once per week
  workflow_dispatch: {}

  # TODO: Temporary, for testing, remove after confirming workflow works well
  push:
    branches:
      - automate-changelog

permissions:
  contents: write
  pull-requests: write

jobs:
  Update-Changelogs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Update changelogs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cargo run --manifest-path  tools/changelog-generator/Cargo.toml -- --output client/src/assets/changelog.json

      - name: Check if new changelog was added
        id: diff
        run: |
          CHANGELOG_FILE="client/src/assets/changelog.json"
          if git diff --quiet "$CHANGELOG_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit if not changed
        if: steps.diff.outputs.changed == 'false'
        run: echo "Nothing changed; skipping."

      - name: Configure git
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch + commit changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          BRANCH="changelog-update-$(date +%s)"
          git switch -c "$BRANCH"
          git add client/src/assets/changelog.json
          git commit -m "Auto update from cronjob"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.branch;
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Update changelogs",
              head: branch,
              base: "master",
              body: "This PR was generated by the scheduled GitHub Action.",
              maintainer_can_modify: true
            });

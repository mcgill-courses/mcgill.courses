name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-workflow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download actionlint
        id: actionlint
        run:
          bash <(curl
          https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Check workflow
        run: ${{ steps.actionlint.outputs.executable }} -color

  client:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Info
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Format
        run: pnpm -r run format-check

      - name: Declutter
        run: pnpm -r run knip

      - name: Lint
        run: pnpm -r run lint

      - name: Test (unit)
        run: pnpm -r run test --reporter verbose

      - name: Install toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install mongodb
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community@7.0
          echo -e 'replication:\n  replSetName: rs0' >> /opt/homebrew/etc/mongod.conf
          brew services start mongodb-community@7.0
          mongosh --eval 'rs.initiate()'

      - name: Install Playwright
        working-directory: client
        run: pnpm exec playwright install chromium

      - name: Test (e2e)
        run: pnpm -r run e2e

  coverage:
    runs-on: macos-latest

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      RUSTFLAGS: --deny warnings
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_REDIRECT_URI: ${{ secrets.MS_REDIRECT_URI }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Install toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Info
        run: |
          cargo --version
          node --version
          pnpm --version
          rustup --version

      - name: Install mongodb
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community@7.0
          echo -e 'replication:\n  replSetName: rs0' >> /opt/homebrew/etc/mongod.conf
          brew services start mongodb-community@7.0
          mongosh --eval 'rs.initiate()'

      - name: Install grcov
        run: cargo install grcov

      - name: Run coverage script
        run: ./bin/coverage release

      - name: Upload to codecov.io
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: coverage/*.lcov

  server:
    runs-on: macos-latest

    env:
      RUSTFLAGS: --deny warnings
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_REDIRECT_URI: ${{ secrets.MS_REDIRECT_URI }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install rust toolchain components
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy, rustfmt
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install mongodb
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community@7.0
          echo -e 'replication:\n  replSetName: rs0' >> /opt/homebrew/etc/mongod.conf
          brew services start mongodb-community@7.0
          mongosh --eval 'rs.initiate()'

      - name: Info
        run: |
          rustup --version
          cargo --version
          cargo clippy --version

      - name: Forbid
        run: |
          brew install ripgrep
          ./bin/forbid

      - name: Unused dependencies
        uses: bnjbvr/cargo-machete@5a6550345dd59f4450caa4cf7779438e875e8914

      - name: Build
        run: cargo build --workspace --all-features --all-targets

      - name: Lockfile
        run: cargo update --locked --package server

      - name: Lint
        run: ./bin/clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --all-features --all-targets

  zizmor:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054

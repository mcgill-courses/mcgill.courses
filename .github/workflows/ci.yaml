name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-workflow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download actionlint
        id: actionlint
        run:
          bash <(curl
          https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Check workflow
        run: |
          "$ACTIONLINT" -color
        env:
          ACTIONLINT: ${{ steps.actionlint.outputs.executable }}

  client:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - name: Info
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Format
        run: pnpm -r run format-check

      - name: Declutter
        run: pnpm -r run knip

      - name: Lint
        run: pnpm -r run lint

      - name: Test (unit)
        run: pnpm -r run test --reporter verbose

      - name: Install toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31

      - name: Install mongodb
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community@7.0
          echo -e 'replication:\n  replSetName: rs0' >> /opt/homebrew/etc/mongod.conf
          brew services start mongodb-community@7.0
          mongosh --eval 'rs.initiate()'

      - name: Install Playwright
        working-directory: client
        run: pnpm exec playwright install chromium

      - name: Test (e2e)
        run: pnpm -r run e2e

  coverage:
    runs-on: macos-latest

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      RUSTFLAGS: --deny warnings
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_REDIRECT_URI: ${{ secrets.MS_REDIRECT_URI }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Install toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31

      - name: Info
        run: |
          cargo --version
          node --version
          pnpm --version
          rustup --version

      - name: Install mongodb
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community@7.0
          echo -e 'replication:\n  replSetName: rs0' >> /opt/homebrew/etc/mongod.conf
          brew services start mongodb-community@7.0
          mongosh --eval 'rs.initiate()'

      - name: Install grcov
        run: cargo install grcov

      - name: Run coverage script
        run: ./bin/coverage release

      - name: Upload to codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: coverage/*.lcov

  server:
    runs-on: macos-latest

    env:
      RUSTFLAGS: --deny warnings
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_REDIRECT_URI: ${{ secrets.MS_REDIRECT_URI }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install rust toolchain components
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          components: clippy, rustfmt
          toolchain: stable

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31

      - name: Install mongodb
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community@7.0
          echo -e 'replication:\n  replSetName: rs0' >> /opt/homebrew/etc/mongod.conf
          brew services start mongodb-community@7.0
          mongosh --eval 'rs.initiate()'

      - name: Info
        run: |
          rustup --version
          cargo --version
          cargo clippy --version

      - name: Forbid
        run: |
          brew install ripgrep
          ./bin/forbid

      - name: Unused dependencies
        uses: bnjbvr/cargo-machete@c25c629b05e3ecb0295a5e33bd82821cf24937ba

      - name: Build
        run: cargo build --workspace --all-features --all-targets

      - name: Lockfile
        run: cargo update --locked --package server

      - name: Lint
        run: ./bin/clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --all-features --all-targets

  zizmor:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b
